name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Måste läsas INNAN version-bump-committen nedan läggs till, annars
      # blir "senaste commit-meddelandet" workflowets egen bump-commit
      # istället för den riktiga ändringen som triggade releasen.
      - name: Capture triggering commit message for release notes
        id: commitmsg
        run: |
          {
            echo 'body<<GH_RELEASE_BODY_EOF'
            git log -1 --format=%B
            echo 'GH_RELEASE_BODY_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Höjer VERSION_CODE +1 och skriver VERSION_NAME=1.<code> — samma
      # format som den lokala Gradle-auto-höjningen i app/build.gradle.kts,
      # som hoppar över sig själv när CI=true (satt automatiskt av Actions)
      # för att undvika dubbel höjning.
      - name: Bump version.properties
        id: bump
        run: |
          current_code=$(grep '^VERSION_CODE=' version.properties | cut -d= -f2)
          new_code=$((current_code + 1))
          new_name="1.$new_code"
          printf 'VERSION_CODE=%s\nVERSION_NAME=%s\n' "$new_code" "$new_name" > version.properties
          echo "version_code=$new_code" >> "$GITHUB_OUTPUT"
          echo "version_name=$new_name" >> "$GITHUB_OUTPUT"

      - name: Decode signing keystore
        run: base64 --decode <<< "${{ secrets.KEYSTORE_BASE64 }}" > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease \
            -PRELEASE_STORE_FILE="$RUNNER_TEMP/release.jks" \
            -PRELEASE_STORE_PASSWORD="${{ secrets.KEYSTORE_PASSWORD }}" \
            -PRELEASE_KEY_ALIAS="${{ secrets.KEY_ALIAS }}" \
            -PRELEASE_KEY_PASSWORD="${{ secrets.KEY_PASSWORD }}"

      # [skip ci] förhindrar att den här pushen triggar workflowet på nytt
      # (GitHub hoppar native över körningar vars HEAD-commit-meddelande
      # innehåller det) — annars en oändlig release-loop.
      - name: Commit version bump back to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.properties
          git commit -m "chore: bump version to ${{ steps.bump.outputs.version_name }} (${{ steps.bump.outputs.version_code }}) [skip ci]"
          git push origin HEAD:main

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.bump.outputs.version_name }}
          name: v${{ steps.bump.outputs.version_name }}
          body: ${{ steps.commitmsg.outputs.body }}
          files: app/build/outputs/apk/release/app-release.apk
